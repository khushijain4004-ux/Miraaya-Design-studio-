
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miraaya Design Studio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf5f0;
      color: #49332f;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 15px auto;
      border-radius: 14px;
      max-width: 500px;
    }
    h1 { color: #874b55; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
    }
    button {
      background: #874b55;
      color: white;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Miraaya Design Studio</h1>
    <p>Your boutique, beautifully organised.</p>
  </div>

  <div class="card">
    <h2>Customer Records</h2>
    <input id="name" placeholder="Customer name">
    <input id="phone" placeholder="Phone number">
    <button onclick="saveCustomer()">Save Customer</button>
    <p id="message"></p>
    <ul id="list"></ul>
  </div>

  <script>
    function saveCustomer() {
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!name) {
        document.getElementById("message").textContent =
          "Please enter a customer name.";
        return;
      }

      const item = document.createElement("li");
      item.textContent = name + (phone ? " — " + phone : "");
      document.getElementById("list").appendChild(item);

      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("message").textContent =
        "Customer added to this page.";
    }
  </script>
</body>
</html>
